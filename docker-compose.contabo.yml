services:
  portal:
    build:
      context: .
    container_name: via-portal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8080"
    expose:
      - "8080"
    networks:
      - via_proxy
      - via_data
    mem_limit: 4g
    cpus: "3.0"
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  via_proxy:
    external: true
  via_data:
    external: true
